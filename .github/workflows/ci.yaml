name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7   # keep in step with README and pubspec

jobs:
  checks:
    name: Format, analyze, layers, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: dart run tool/check_layers.dart
      # Golden screenshots are made on macOS; font rendering differs on Linux.
      - run: flutter test --exclude-tags golden

  android-dev-build:
    name: Android build (dev, debug)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # CI has no local env files, so it builds with the committed example.
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.example.json
