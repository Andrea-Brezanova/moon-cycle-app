name: CI

on:
  # Pull requests run the checks (the required check names come from this run);
  # main runs them again after each merge. Pushing a branch with a PR open used
  # to start a second, identical run, so branches no longer trigger on push.
  # Run tool/precheck.sh before pushing to catch failures locally.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR replaces its obsolete run. Runs on main are never
# cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7   # keep in step with README and pubspec

jobs:
  checks:
    name: Format, analyze, layers, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: dart run tool/check_layers.dart
      # Golden screenshots are made on macOS; font rendering differs on Linux,
      # so they run in the separate `golden-tests` job below.
      - run: flutter test --exclude-tags golden

  golden-tests:
    name: Golden screenshots (macOS)
    # Pinned (not macos-latest) so a runner upgrade can't change rendering.
    # The references are recorded on macOS 15 and match this runner, so a
    # failure here is a real difference and blocks the run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Goldens are recorded on macOS, so they are compared on macOS. Never
      # regenerate them in CI.
      - run: |
          set -o pipefail
          flutter test --tags golden 2>&1 | tee golden.log
      # Shown on the run's summary page: how far each image is from the
      # recorded one, and whether the sizes differ, without downloading anything.
      - name: Summarise golden differences
        if: failure()
        run: |
          {
            echo '### Golden differences'
            echo '```'
            grep -E 'Pixel test failed|image sizes|Golden ".*" did not|Could not be compared' golden.log | sed -E 's/^.*(Pixel test failed|image sizes|Golden)/\1/' | sort | uniq -c | sort -rn | head -30
            echo '```'
            echo "Runner: $(sw_vers -productVersion), $(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable without signing in, so the differences can
          # be inspected from the API: environment first, then each failure.
          echo "::error title=Golden environment::macOS $(sw_vers -productVersion) $(uname -m); $(flutter --version | head -1); fonts: $(ls assets/fonts | wc -l) files"
          grep -E 'Golden ".*": ' golden.log | sed -E 's/^.*Golden "goldens\///' | sort -u | head -12 | while read -r line; do echo "::error title=Golden diff::$line"; done
      - name: Keep failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/*.png'
          if-no-files-found: ignore

  android-dev-build:
    name: Android build (dev, debug)
    runs-on: ubuntu-latest
    # Runs alongside the checks job instead of waiting for it; both are required.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # CI has no local env files, so it builds with the committed example.
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.example.json
