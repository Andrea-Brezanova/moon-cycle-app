name: moon_cycle
description: "Moon Cycle: cycle-aware food guidance, recipes and a shopping list."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Baseline: Flutter 3.47.7 stable with Dart 3.13.5 (see README).
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sentry_flutter: ^10.0.0
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# The database is encrypted: package:sqlite3 bundles SQLite3MultipleCiphers
# instead of plain SQLite (see docs/decisions.md, Milestone 5).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  # Copied from design/assets (the read-only Editorial v3 handoff).
  assets:
    - assets/logo/
    - assets/mark/
    # The read-only catalogue (see assets/content/README.md).
    - assets/content/taxonomy.json
    - assets/content/phases.json
    - assets/content/foods.json
    - assets/content/recipes.json
    # The five reviewed Food Detail profiles (assets/content/README.md).
    - assets/content/food_profiles.json
    # One photo per recipe, named <recipe-id>.jpg.
    - assets/images/recipes/
    # Curated plant photos for Home's "3 plants a day" (see docs/photo-credits.md).
    - assets/images/foods/
    # Home's "Today's picks" photographs (credits: docs/photo-credits.md).
    - assets/images/home/

  # Static cuts from the handoff. Fraunces is cut at SOFT 50, WONK 0, in two
  # optical sizes: Fraunces72 for 40 pt and up, Fraunces24 below that.
  fonts:
    - family: Fraunces72
      fonts:
        - asset: assets/fonts/Fraunces_72pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces_72pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces_72pt-Italic.ttf
          weight: 400
          style: italic
    - family: Fraunces24
      fonts:
        - asset: assets/fonts/Fraunces_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces_24pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces_24pt-MediumItalic.ttf
          weight: 500
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_14pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_14pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_14pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_14pt-Bold.ttf
          weight: 700
    - family: Gwendolyn
      fonts:
        - asset: assets/fonts/Gwendolyn-Bold.ttf
          weight: 700
