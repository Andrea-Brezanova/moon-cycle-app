targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps timestamps readable and maps 1:1 to Postgres
          # timestamptz when sync arrives.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/core/database/drift/
